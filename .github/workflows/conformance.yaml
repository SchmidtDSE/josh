name: Conformance Tests

# feat/runnable-static-docs is an integration branch, and PRs stack onto it rather than onto dev.
# Without it listed here those PRs run build.yaml, which triggers on any push, but not this
# workflow -- so the conformance suite would go ungated for the whole life of that branch, which
# is precisely the work that adds conformance tests and drives them from the docs manifest.
# REMOVE THESE TWO ENTRIES in the pull request that merges feat/runnable-static-docs into dev.
on:
  pull_request:
    branches:
      - main
      - dev
      - feat/runnable-static-docs
  push:
    branches:
      - main
      - dev
      - feat/runnable-static-docs

jobs:
  conformance:
    runs-on: ubuntu-latest
    name: Run Conformance Tests

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup netCDF
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev

      - name: Build fat jar
        run: ./gradlew fatJar

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/build/uv.lock

      - name: Harvest docs manifest
        run: ./gradlew harvestDocs

      # harvestDocs warns and skips when uv is missing so that a Java-only checkout still builds.
      # Here uv is installed on purpose, so a missing manifest means the harvest silently did not
      # happen and the suite would quietly fall back to the filename walk.
      - name: Confirm the manifest was written
        run: test -f build/docs/docs-manifest.json

      - name: Run conformance tests
        id: conformance
        continue-on-error: true
        run: ./gradlew conformanceTest

      - name: Run critical conformance tests (gating)
        run: ./gradlew conformanceTestCritical

      - name: Parse test results
        if: always()
        id: parse
        run: .github/scripts/parse_conformance_results.sh build/test-results/conformanceTest

      - name: Generate failure report
        if: always()
        run: .github/scripts/generate_conformance_report.sh build/test-results/conformanceTest "${{ github.head_ref || github.ref_name }}" "${{ github.sha }}"

      - name: Create job summary
        if: always()
        run: |
          echo "## Conformance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.parse.outputs.summary || 'No results available' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-test-results
          path: |
            build/test-results/conformanceTest/
            build/reports/tests/conformanceTest/
            conformance-report.md
          retention-days: 30
